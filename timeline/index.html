@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#00160C; --surface:#00241A; --ink:#F1F4F2; --muted:#9DB1A6; --line:#0D3A27; --line-strong:#1C5238;
  --mast:var(--dark); --lane:#002F19;
  --link:var(--neon); --focus:var(--neon);
  --band-pre:rgba(0,255,0,.045); --band-impl:rgba(255,255,255,.02);
  --s-done:#6E8378; --s-ontrack:#5B92F0; --s-risk:#F2B33D; --s-blocked:#FF6B57; --s-not:#4F6A5C;
  --crit:var(--neon); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#00160C; --surface:#00241A; --ink:#F1F4F2; --muted:#9DB1A6; --line:#0D3A27; --line-strong:#1C5238;
  --mast:var(--dark); --lane:#002F19;
  --link:var(--neon); --focus:var(--neon);
  --band-pre:rgba(0,255,0,.045); --band-impl:rgba(255,255,255,.02);
  --s-done:#6E8378; --s-ontrack:#5B92F0; --s-risk:#F2B33D; --s-blocked:#FF6B57; --s-not:#4F6A5C;
  --crit:var(--neon); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* masthead: neon field, dark-green type and logo, oversized mark as watermark */
.mast{background:var(--dark);color:var(--mast-ink);border-radius:10px;overflow:hidden}
.mast-top{position:relative;background:var(--neon);color:var(--dark);padding:18px 22px 20px;display:flex;align-items:center;gap:22px;overflow:hidden;isolation:isolate}
.mast-top::after{content:"";position:absolute;right:-60px;top:-40px;width:420px;height:250px;background:var(--logo) no-repeat right center/contain;opacity:.08;z-index:-1;pointer-events:none}
.logo{flex:none;width:96px;aspect-ratio:752/448;background:var(--logo) no-repeat center/contain}
.mast-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dark);font-weight:700}
.tag{border:1.5px solid var(--dark);border-radius:3px;padding:0 6px;font-size:11px;letter-spacing:.08em}
h1{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(26px,3.6vw,40px);line-height:.98;margin:2px 0 0;letter-spacing:.005em;text-wrap:balance;color:var(--dark)}
.sub{color:var(--dark);opacity:.8;font-size:14.5px;font-weight:500}
@media (max-width:560px){.mast-top{flex-direction:column;align-items:flex-start;gap:12px}.logo{width:76px}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--mast-line)}
.stat{padding:12px 20px 14px;min-width:0;border-right:1px solid var(--mast-line)}
.stat:last-child{border-right:0}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mast-muted);font-weight:700}
.stat .v{font-family:var(--f-display);font-weight:900;font-size:28px;color:var(--neon);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d{font-size:12.5px;color:var(--mast-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.risk{color:var(--s-risk-hi)} .v.blocked{color:var(--s-blocked-hi)}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:0;background:transparent;color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--neon)}
.seg button:focus-visible,.chk:focus-within,.item:focus-visible,.watch button:focus-visible,.deps button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chk{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line-strong);border-radius:5px;padding:5px 11px;background:var(--surface);cursor:pointer}
.chk input{accent-color:var(--mid);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:8px;border-radius:2px;display:inline-block}
.sw.gate{width:9px;height:9px;transform:rotate(45deg);border-radius:1px;background:var(--ink)}
.sw.crit{background:transparent;box-shadow:inset 0 0 0 2px var(--crit)}

/* gantt */
.gantt{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.canvas{position:relative}
.layer{position:absolute;top:0;bottom:0;left:var(--lane-w);pointer-events:none}
.mline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.mline.year{border-left-color:var(--line-strong)}
.band{position:absolute;top:0;bottom:0}
.band.pre{background:var(--band-pre)} .band.impl{background:var(--band-impl)}
.gline{position:absolute;top:46px;bottom:0;border-left:1px dashed var(--line-strong)}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink)}
.today b{position:absolute;top:3px;left:0;font-family:var(--f-display);font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--black);background:var(--neon);padding:1px 5px;border-radius:0 2px 2px 0;white-space:nowrap}

.row{display:flex;position:relative;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{position:sticky;left:0;z-index:4;width:var(--lane-w);flex:0 0 var(--lane-w);background:var(--lane);color:var(--lane-ink);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;margin-bottom:-1px}
.lab .n{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.lab .c{font-size:11.5px;color:var(--lane-muted);line-height:1.25}
.track{position:relative;flex:0 0 auto}

.hdr{position:relative;height:46px;border-bottom:1px solid var(--line-strong)}
.hdr .lab{justify-content:flex-end;padding-bottom:7px;border-bottom:2px solid var(--neon)}
.hdr .lab .c{text-transform:uppercase;letter-spacing:.1em;color:var(--neon);font-weight:700;font-size:11px}
.yr,.mo{position:absolute;white-space:nowrap;font-variant-numeric:tabular-nums}
.yr{top:5px;font-family:var(--f-display);font-size:14px;font-weight:900;padding-left:6px}
.mo{top:26px;font-size:11.5px;color:var(--muted);padding-left:5px;text-transform:uppercase;letter-spacing:.04em}
.phase{position:absolute;top:5px;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--neon);background:var(--dark);padding:1px 7px;border-radius:3px;white-space:nowrap}

.item{position:absolute;height:22px;display:flex;align-items:center;border:0;padding:0;background:none;font:inherit;color:var(--ink);cursor:pointer;text-align:left;transition:opacity .15s}
.item .b{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:3px;background:var(--sc)}
.item.s-not .b{background:repeating-linear-gradient(135deg,var(--sc) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1px var(--sc)}
.item.crit .b{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--crit)}
.item.s-not.crit .b{box-shadow:inset 0 0 0 1px var(--sc),0 0 0 2px var(--surface),0 0 0 3.5px var(--crit)}
.item .t{position:relative;font-size:12.5px;font-weight:500;white-space:nowrap;padding:0 7px;line-height:22px}
.item.inside .t{color:#fff}
.item.s-risk.inside .t{color:#000}
.item.s-not.inside .t,.item.outside .t{color:var(--ink)}
.item.s-not.inside .t{background:var(--surface);margin-left:4px;padding:0 5px;line-height:16px;border-radius:2px}
.item.gate .dia{position:absolute;left:-7px;top:4px;width:14px;height:14px;transform:rotate(45deg);background:var(--sc);border-radius:2px;box-shadow:0 0 0 2px var(--surface)}
.item.gate.major .dia{background:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--sc)}
.item.gate .t{margin-left:10px;font-weight:700}
.item.dim{opacity:.18}
.item.sel .b,.item.sel .dia{outline:2px solid var(--focus);outline-offset:3px}

/* lower panels */
.lower{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.lower{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.panel h2{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.panel h2::before{content:"";width:8px;height:8px;background:var(--neon);flex:none}
.dt{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:26px;line-height:1.02;margin:0 0 10px;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:12px;font-weight:500;color:var(--ink);border:1px solid var(--line-strong);border-radius:99px;padding:1px 9px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:2px}
dd{margin:0;min-width:0}
.mono{font-variant-numeric:tabular-nums;font-weight:500}
.note{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--sc);background:var(--bg);font-size:14px;border-radius:0 4px 4px 0;max-width:65ch}
.deps button{font:inherit;color:var(--link);font-weight:500;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.watch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.watch li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.watch li:last-child{border-bottom:0}
.watch button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
.watch button:hover{text-decoration:underline}
.watch .st{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sc);display:inline-block}
.foot{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.foot .wm{font-family:var(--f-display);font-weight:900;color:var(--ink);letter-spacing:.02em}
@media (max-width:560px){:root{--lane-w:118px}.lab{padding:6px 9px}.lab .n{font-size:14px}.lab .c{font-size:10.5px}.mast-top{padding:16px}.stat{padding:10px 16px 12px}}
.pick select{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:5px 10px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.open{margin:14px 0 0;font-size:13.5px}.open a{color:var(--link);font-weight:700;text-decoration:none}.open a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <div class="logo" role="img" aria-label="RENEWD"></div>
      <div class="mast-txt">
        <div class="eyebrow"><span>Project timeline</span><span class="tag" id="sampletag">Sample data</span></div>
        <h1 id="pname">RENEWD project timeline</h1>
        <div class="sub" id="psub"></div>
      </div>
    </div>
    <section class="stats" id="stats" aria-label="Key dates"></section>
  </header>

  <div class="bar">
    <div class="ctrls">
      <label class="pick" hidden><span class="vh">Project</span><select id="proj"></select></label>
      <div class="seg" role="group" aria-label="Phase">
        <button type="button" id="ph-all" data-ph="all" aria-pressed="true">Full timeline</button>
        <button type="button" id="ph-pre" data-ph="pre" aria-pressed="false">Pre-SPA</button>
        <button type="button" id="ph-impl" data-ph="impl" aria-pressed="false">SPA → COD</button>
      </div>
      <label class="chk"><input type="checkbox" id="crit"> Critical path only</label>
      <div class="seg" role="group" aria-label="Zoom">
        <button type="button" id="zo" aria-label="Zoom out">−</button>
        <button type="button" id="zi" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="legend" aria-label="Legend">
      <span><i class="sw" style="background:var(--s-done)"></i>Done</span>
      <span><i class="sw" style="background:var(--s-ontrack)"></i>On track</span>
      <span><i class="sw" style="background:var(--s-risk)"></i>At risk</span>
      <span><i class="sw" style="background:var(--s-blocked)"></i>Blocked</span>
      <span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--s-not) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--s-not)"></i>Not started</span>
      <span><i class="sw gate"></i>Gate</span>
      <span><i class="sw crit"></i>Critical path</span>
    </div>
  </div>

  <div class="gantt" id="gantt"><div class="canvas" id="canvas"></div></div>

  <div class="lower">
    <section class="panel" id="detail" aria-live="polite"></section>
    <section class="panel">
      <h2>Needs attention</h2>
      <ul class="watch" id="watch"></ul>
    </section>
  </div>
  <p class="foot"><span class="wm">RENEWD</span><span id="synced"></span><span>Click any bar or gate for details. Edit the data in Notion.</span></p>
</div>

<script>
/* Data comes from ./data.json, which a GitHub Action rebuilds from Notion every 30 minutes.
   Pick a project with ?project=<code>. FALLBACK is used only if data.json can't be loaded. */
const LANES = [
  {id:"commercial", name:"Commercial", cap:"LOI → SPA → closing"},
  {id:"dd",         name:"Due diligence", cap:"Legal · technical · financial"},
  {id:"permit",     name:"Permitting", cap:"CU · environmental · PUZ · AC"},
  {id:"grid",       name:"Grid", cap:"ATR · connection · energisation"},
  {id:"finance",    name:"Finance", cap:"Debt raise → financial close"},
  {id:"proc",       name:"Procurement", cap:"BESS · EPC · long-lead"},
  {id:"build",      name:"Build & COD", cap:"NTP → commissioning → COD"}
];
const FALLBACK = {"projects": {"iezeris": {"name": "Project Iezeris", "capacity": "50 MW / 100 MWh", "location": "Romania", "summary": "", "stage": "SPA → Closing", "sample": false, "items": [{"id": "407f912a036f811d992dc1596d0c2779", "lane": "commercial", "name": "SPA drafting & negotiation", "s": "2026-12-01", "e": "2027-03-19", "st": "not", "ph": "pre", "own": "Legal counsel", "crit": 1, "dep": ["407f912a036f81f28326c28f29896cae", "407f912a036f81d3b2b1cc5a6fb2c76c", "407f912a036f81639db3f00567362fb8"], "note": "", "url": "https://app.notion.com/p/407f912a036f811d992dc1596d0c2779"}]}}};

const STATUS = {done:"Done",ontrack:"On track",risk:"At risk",blocked:"Blocked",not:"Not started"};
const SC = {done:"var(--s-done)",ontrack:"var(--s-ontrack)",risk:"var(--s-risk)",blocked:"var(--s-blocked)",not:"var(--s-not)"};
const DAY = 864e5;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ZOOMS = [30,40,52,64,84,110,140];
const d = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
const fmt = s => new Date(d(s)).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
const now = new Date(); const TODAY = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA, CODE, P, ITEMS = [], byId = {}, T0, T1, SPA, COD;
let pxMonth = window.innerWidth < 560 ? 46 : 64;
let phase = "all", critOnly = false, selected = null;
const canvas = document.getElementById("canvas"), gantt = document.getElementById("gantt");
const laneW = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lane-w")) || 176;
const X = t => (t - T0) / DAY * (pxMonth / 30.4375);

function loadProject(code){
  CODE = code; P = DATA.projects[code];
  ITEMS = (P.items || []).filter(i => i.s && LANES.some(l => l.id === i.lane));
  byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
  const starts = ITEMS.map(i => d(i.s)), ends = ITEMS.map(i => d(i.e || i.s));
  const lo = new Date(Math.min(TODAY, ...starts)), hi = new Date(Math.max(TODAY, ...ends));
  T0 = Date.UTC(lo.getUTCFullYear(), lo.getUTCMonth(), 1);
  T1 = Date.UTC(hi.getUTCFullYear(), hi.getUTCMonth() + 2, 1);
  const majors = ITEMS.filter(i => i.gate && i.major).sort((a,b) => d(a.s) - d(b.s));
  SPA = majors.filter(i => i.ph === "pre").pop() || ITEMS.filter(i => i.gate && i.ph === "pre").sort((a,b) => d(a.s) - d(b.s)).pop() || null;
  COD = majors[majors.length - 1] || null;
  document.getElementById("pname").textContent = [P.name, P.capacity ? P.capacity + " BESS" : ""].filter(Boolean).join(" · ");
  document.getElementById("psub").textContent = P.summary || [P.location, P.stage].filter(Boolean).join(" · ");
  document.getElementById("sampletag").hidden = !P.sample;
  document.title = P.name + " · RENEWD Timeline";
  selected = null;
  render(); stats(); watch();
  const first = ITEMS.find(i => i.st === "blocked") || ITEMS.find(i => i.st === "risk") || ITEMS.find(i => i.st !== "done") || ITEMS[0];
  if (first) select(first.id); else document.getElementById("detail").innerHTML = '<h2>Details</h2><p>No milestones yet. Add rows to the Milestones database in Notion.</p>';
  gantt.scrollLeft = Math.max(0, X(TODAY) - (gantt.clientWidth - laneW()) * .25);
}

function render(){
  const W = X(T1), LW = laneW();
  canvas.innerHTML = ""; canvas.style.width = (LW + W) + "px";
  const layer = el("div","layer"); layer.style.width = W + "px"; canvas.appendChild(layer);
  const spaX = SPA ? X(d(SPA.s)) : W;
  const b1 = el("div","band pre"); b1.style.left = 0; b1.style.width = spaX + "px";
  const b2 = el("div","band impl"); b2.style.left = spaX + "px"; b2.style.width = (W - spaX) + "px";
  layer.append(b1, b2);

  const hdr = el("div","row hdr");
  hdr.appendChild(el("div","lab",'<span class="c">Workstream</span>'));
  const ht = el("div","track"); ht.style.width = W + "px"; hdr.appendChild(ht);
  const s0 = new Date(T0);
  for (let y = s0.getUTCFullYear(), m = s0.getUTCMonth(); Date.UTC(y,m,1) < T1; m++){
    if (m > 11){ m = 0; y++; }
    const x = X(Date.UTC(y,m,1));
    const ml = el("div","mline" + (m===0 ? " year" : "")); ml.style.left = x + "px"; layer.appendChild(ml);
    const mo = el("div","mo", pxMonth < 44 ? MONTHS[m][0] : MONTHS[m]); mo.style.left = x + "px"; ht.appendChild(mo);
    if (m === 0 || x === 0){ const yr = el("div","yr",y); yr.style.left = x + "px"; ht.appendChild(yr); }
  }
  const pl1 = el("div","phase","Pre-SPA"); pl1.style.left = "60px"; ht.appendChild(pl1);
  if (SPA){ const pl2 = el("div","phase","SPA → COD"); pl2.style.left = (spaX + 8) + "px"; ht.appendChild(pl2); }
  canvas.appendChild(hdr);

  ITEMS.filter(i => i.gate && i.major).forEach(i => { const g = el("div","gline"); g.style.left = X(d(i.s)) + "px"; layer.appendChild(g); });
  if (TODAY >= T0 && TODAY <= T1){ const t = el("div","today","<b>TODAY</b>"); t.style.left = X(TODAY) + "px"; layer.appendChild(t); }

  LANES.forEach(L => {
    const items = ITEMS.filter(i => i.lane === L.id).sort((a,b) => d(a.s) - d(b.s));
    const tracks = [], placed = [];
    items.forEach(i => {
      const x0 = X(d(i.s)), labW = i.name.length * 6.4 + 18;
      let left, right, inside = false, w = 0;
      if (i.gate){ left = x0 - 8; right = x0 + 12 + labW; }
      else { w = Math.max(4, X(d(i.e) + DAY) - x0); inside = w >= labW; left = x0; right = inside ? x0 + w : x0 + w + labW; }
      let k = tracks.findIndex(end => end + 6 <= left);
      if (k < 0){ k = tracks.length; tracks.push(0); }
      tracks[k] = right; placed.push({i, x0, w, k, inside});
    });
    const row = el("div","row"); row.style.height = (Math.max(1, tracks.length) * 30 + 10) + "px";
    row.appendChild(el("div","lab",`<span class="n">${esc(L.name)}</span><span class="c">${esc(L.cap)}</span>`));
    const tr = el("div","track"); tr.style.width = W + "px";
    placed.forEach(({i,x0,w,k,inside}) => {
      const b = el("button","item s-" + i.st + (i.crit ? " crit" : "") + (i.gate ? " gate" : "") + (i.major ? " major" : "") + (i.gate ? "" : inside ? " inside" : " outside"));
      b.type = "button"; b.dataset.id = i.id; b.style.setProperty("--sc", SC[i.st]);
      b.style.left = x0 + "px"; b.style.top = (9 + k*30) + "px";
      b.setAttribute("aria-label", `${i.name}, ${STATUS[i.st]}, ${i.gate ? fmt(i.s) : fmt(i.s) + " to " + fmt(i.e)}`);
      if (i.gate) b.innerHTML = `<span class="dia"></span><span class="t">${esc(i.name)}</span>`;
      else if (inside){ b.style.width = w + "px"; b.innerHTML = `<span class="b"></span><span class="t">${esc(i.name)}</span>`; }
      else { b.innerHTML = `<span class="b" style="width:${w}px"></span><span class="t" style="margin-left:${w}px">${esc(i.name)}</span>`; }
      b.addEventListener("click", () => select(i.id));
      tr.appendChild(b);
    });
    row.appendChild(tr); canvas.appendChild(row);
  });
  applyFilters();
}

function applyFilters(){
  canvas.querySelectorAll(".item").forEach(b => {
    const i = byId[b.dataset.id];
    b.classList.toggle("dim", (phase !== "all" && i.ph !== phase) || (critOnly && !i.crit));
    b.classList.toggle("sel", i.id === selected);
  });
}
function scrollToT(t, frac){
  gantt.scrollTo({left: Math.max(0, X(t) - (gantt.clientWidth - laneW()) * frac), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
const daysTo = t => Math.round((t - TODAY) / DAY);
const rel = n => n === 0 ? "today" : n > 0 ? `in ${n} days` : `${-n} days ago`;

function stats(){
  const next = ITEMS.filter(i => i.gate && d(i.s) >= TODAY && i.st !== "done").sort((a,b) => d(a.s) - d(b.s))[0];
  const risk = ITEMS.filter(i => i.st === "risk").length, blocked = ITEMS.filter(i => i.st === "blocked").length;
  const months = t => Math.max(0, Math.round((t - TODAY) / DAY / 30.4375));
  const gateStat = (k, g, unit) => {
    if (!g) return `<div class="stat"><div class="k">${k}</div><div class="v">—</div><div class="d">Mark a major gate in Notion</div></div>`;
    if (g.st === "done" || d(g.s) < TODAY) return `<div class="stat"><div class="k">${k}</div><div class="v">${g.st === "done" ? "Done" : "Overdue"}</div><div class="d">${fmt(g.s)}</div></div>`;
    const v = unit === "m" ? months(d(g.s)) + " months" : daysTo(d(g.s)) + " days";
    return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${fmt(g.s)}</div></div>`;
  };
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="k">Next gate</div><div class="v">${next ? esc(next.name) : "—"}</div><div class="d">${next ? fmt(next.s) + " · " + rel(daysTo(d(next.s))) : "No open gates"}</div></div>
    ${gateStat(SPA ? esc(SPA.name) : "SPA signing", SPA, "d")}
    ${gateStat(COD ? esc(COD.name) : "COD", COD, "m")}
    <div class="stat"><div class="k">At risk</div><div class="v ${risk ? "risk" : ""}">${risk}</div><div class="d">items slipping</div></div>
    <div class="stat"><div class="k">Blocked</div><div class="v ${blocked ? "blocked" : ""}">${blocked}</div><div class="d">waiting on others</div></div>`;
}

function watch(){
  const rank = s => ({blocked:0, risk:1}[s] ?? 2);
  const list = ITEMS.filter(i => i.st === "risk" || i.st === "blocked" ||
      (i.st !== "done" && d(i.s) <= TODAY + 45*DAY && d(i.e || i.s) >= TODAY) ||
      (i.st !== "done" && d(i.e || i.s) < TODAY))
    .sort((a,b) => rank(a.st) - rank(b.st) || d(a.s) - d(b.s)).slice(0,7);
  const ul = document.getElementById("watch"); ul.innerHTML = "";
  if (!list.length){ ul.innerHTML = '<li><span></span><span>Nothing needs attention right now.</span><span></span></li>'; return; }
  list.forEach(i => {
    const late = i.st !== "done" && d(i.e || i.s) < TODAY;
    const li = el("li");
    li.innerHTML = `<span class="dot" style="--sc:${SC[i.st]}"></span><button type="button">${esc(i.name)}</button><span class="st">${late && i.st !== "blocked" ? "Overdue" : STATUS[i.st]}</span>`;
    li.querySelector("button").addEventListener("click", () => { select(i.id); scrollToT(d(i.s), .3); });
    ul.appendChild(li);
  });
}

function select(id){
  const i = byId[id]; if (!i) return; selected = id;
  const L = LANES.find(l => l.id === i.lane);
  const dur = i.gate ? null : Math.round((d(i.e) - d(i.s)) / DAY) + 1;
  const link = x => byId[x] ? `<button type="button" data-go="${x}">${esc(byId[x].name)}</button>` : "";
  const deps = (i.dep || []).map(link).filter(Boolean).join(", ");
  const unlocks = ITEMS.filter(o => (o.dep || []).includes(id)).map(o => link(o.id)).join(", ");
  const timing = i.gate ? rel(daysTo(d(i.s))) : (TODAY < d(i.s) ? "starts " + rel(daysTo(d(i.s))) : TODAY > d(i.e) ? "ended " + rel(daysTo(d(i.e))) : "ends " + rel(daysTo(d(i.e))));
  const p = document.getElementById("detail");
  p.style.setProperty("--sc", SC[i.st]);
  p.innerHTML = `<h2>${esc(L.name)} · ${i.ph === "pre" ? "Pre-SPA" : "SPA → COD"}</h2>
    <p class="dt">${esc(i.name)}</p>
    <div class="chips"><span class="pill" style="--sc:${SC[i.st]}">${STATUS[i.st]}</span>${i.gate ? '<span class="chip">Gate</span>' : ""}${i.crit ? '<span class="chip">Critical path</span>' : ""}</div>
    <dl>
      <dt>${i.gate ? "Date" : "Dates"}</dt><dd class="mono">${i.gate ? fmt(i.s) : fmt(i.s) + " → " + fmt(i.e)}${dur ? ` · ${dur} days` : ""}</dd>
      <dt>Timing</dt><dd>${timing}</dd>
      <dt>Owner</dt><dd>${esc(i.own || "—")}</dd>
      <dt>Depends on</dt><dd class="deps">${deps || "—"}</dd>
      <dt>Unlocks</dt><dd class="deps">${unlocks || "—"}</dd>
    </dl>
    ${i.note ? `<p class="note">${esc(i.note)}</p>` : ""}
    ${i.url ? `<p class="open"><a href="${esc(i.url)}" target="_blank" rel="noopener">Edit in Notion ↗</a></p>` : ""}`;
  p.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { select(b.dataset.go); scrollToT(d(byId[b.dataset.go].s), .3); }));
  applyFilters();
}

document.querySelectorAll("[data-ph]").forEach(b => b.addEventListener("click", () => {
  phase = b.dataset.ph;
  document.querySelectorAll("[data-ph]").forEach(x => x.setAttribute("aria-pressed", x === b));
  applyFilters();
  if (phase === "pre") scrollToT(T0, 0);
  else if (phase === "impl" && SPA) scrollToT(d(SPA.s), .05);
  else scrollToT(TODAY, .25);
}));
document.getElementById("crit").addEventListener("change", e => { critOnly = e.target.checked; applyFilters(); });
function zoom(dir){
  const centerT = T0 + ((gantt.scrollLeft + (gantt.clientWidth - laneW())/2) / (pxMonth/30.4375)) * DAY;
  let k = ZOOMS.findIndex(z => z >= pxMonth); if (k < 0) k = ZOOMS.length - 1;
  pxMonth = ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, k + dir))];
  render(); gantt.scrollLeft = Math.max(0, X(centerT) - (gantt.clientWidth - laneW())/2);
}
document.getElementById("zi").addEventListener("click", () => zoom(1));
document.getElementById("zo").addEventListener("click", () => zoom(-1));
document.getElementById("proj").addEventListener("change", e => loadProject(e.target.value));

function boot(data, live){
  DATA = data;
  const codes = Object.keys(DATA.projects || {});
  if (!codes.length){ document.getElementById("pname").textContent = "No published projects"; return; }
  const want = new URLSearchParams(location.search).get("project");
  const code = codes.includes(want) ? want : codes[0];
  const sel = document.getElementById("proj");
  sel.innerHTML = codes.map(c => `<option value="${esc(c)}">${esc(DATA.projects[c].name)}</option>`).join("");
  sel.value = code; sel.parentElement.hidden = codes.length < 2 || !!want;
  document.getElementById("synced").textContent = live && DATA.generated
    ? "Synced from Notion " + new Date(DATA.generated).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})
    : "Offline copy";
  loadProject(code);
}
fetch("data.json?t=" + Math.floor(Date.now() / 60000), {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => boot(j, true))
  .catch(() => boot(FALLBACK, false));
</script>

</body>
</html>
